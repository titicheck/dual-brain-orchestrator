<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-label="Benchmark comparison: Dual-Brain Orchestrator vs Official Native Orchestrator">
  <!-- Outer Dark-Slate Container -->
  <rect x="1" y="1" width="958" height="488" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc">Dual-Brain Orchestrator vs Official Native Orchestrator</text>
  <text x="28" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Measured across 281 production trajectories (17,414 steps, 3.57B tokens), 314 real switches &amp; live v2.0.1 runs</text>

  <!-- 4 Top KPI Cards -->
  <rect x="24" y="76" width="218" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="40" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#56d364">-34% to -84%</text>
  <text x="40" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Lower Quota Spend</text>
  <text x="40" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Multi-hour &amp; follow-up tweaks</text>

  <rect x="255" y="76" width="218" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="271" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#79c0ff">95.0%</text>
  <text x="271" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Aggregate KV-Cache Hit</text>
  <text x="271" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Incl. &gt;300s reloads (vs 89.2%)</text>

  <rect x="486" y="76" width="218" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="502" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#56d364">0</text>
  <text x="502" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Stream Timeouts</text>
  <text x="502" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">vs 31 retries/timeouts Official</text>

  <rect x="717" y="76" width="219" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="733" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#d2a8ff">15-25 min</text>
  <text x="733" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Faster / 1k Steps</text>
  <text x="733" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">1/134 vs 1/44-58 compactions</text>

  <!-- Legend Row -->
  <rect x="28" y="173" width="12" height="12" rx="3" fill="#3fb950"/>
  <text x="46" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Dual-Brain Orchestrator (v2.0.x)</text>
  <rect x="258" y="173" width="12" height="12" rx="3" fill="#f85149"/>
  <text x="276" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Official Native Orchestrator</text>

  <!-- Lower-Left Panel: Quota & Cost Rate -->
  <rect x="24" y="196" width="444" height="254" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="42" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Quota &amp; Cost Rate (Lower is Better)</text>

  <!-- Group 1: Multi-Hour Session (1x List) -->
  <text x="42" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Multi-Hour Session (1x List)</text>
  <rect x="42" y="250" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="250" width="248" height="10" rx="3" fill="#f85149"/>
  <text x="298" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">$100.8</text>
  <rect x="42" y="264" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="264" width="163" height="10" rx="3" fill="#3fb950"/>
  <text x="298" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">$66.2 (-34%)</text>

  <!-- Group 2: High-Context >200K Tier (2x) -->
  <text x="42" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">High-Context &gt;200K Tier (2x)</text>
  <rect x="42" y="303" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="303" width="248" height="10" rx="3" fill="#f85149"/>
  <text x="298" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">$181.7</text>
  <rect x="42" y="317" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="317" width="139" height="10" rx="3" fill="#3fb950"/>
  <text x="298" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">$83-$120 (-34%..-54%)</text>

  <!-- Group 3: Ongoing Follow-Ups (Turn 2+) -->
  <text x="42" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Ongoing Follow-Ups (Turn 2+)</text>
  <rect x="42" y="356" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="356" width="248" height="10" rx="3" fill="#f85149"/>
  <text x="298" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">100% baseline</text>
  <rect x="42" y="370" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="370" width="87" height="10" rx="3" fill="#3fb950"/>
  <text x="298" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">16%-55% (-45%..-84%)</text>

  <!-- Group 4: Long Build / Debug (1k Steps, 2x) -->
  <text x="42" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Long Build / Debug (1k Steps, 2x)</text>
  <rect x="42" y="409" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="409" width="248" height="10" rx="3" fill="#f85149"/>
  <text x="298" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">$173.5</text>
  <rect x="42" y="423" width="248" height="10" rx="3" fill="#21262d"/>
  <rect x="42" y="423" width="132" height="10" rx="3" fill="#3fb950"/>
  <text x="298" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">$92.7 (-47%)</text>

  <!-- Lower-Right Panel: KV-Cache & Execution Health -->
  <rect x="492" y="196" width="444" height="254" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="510" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">KV-Cache &amp; Execution Health</text>

  <!-- Group 1: Session KV-Cache Hit Rate (Higher Better) -->
  <text x="510" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Aggregate Session KV-Cache Hit (Incl. TTL Reloads)</text>
  <rect x="510" y="250" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="250" width="209" height="10" rx="3" fill="#3fb950"/>
  <text x="738" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">95.0%</text>
  <rect x="510" y="264" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="264" width="196" height="10" rx="3" fill="#f85149"/>
  <text x="738" y="273" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">89.2%</text>

  <!-- Group 2: Switch Cold-Cache Miss Rate (Lower Better) -->
  <text x="510" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Switch Cold-Cache Miss Rate (Lower Better)</text>
  <rect x="510" y="303" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="303" width="6" height="10" rx="3" fill="#3fb950"/>
  <text x="738" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">~0% (Trunk warm)</text>
  <rect x="510" y="317" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="317" width="165" height="10" rx="3" fill="#f85149"/>
  <text x="738" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">69.7% - 75.1%</text>

  <!-- Group 3: Compactions per 1k Steps (Lower Better) -->
  <text x="510" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Compactions per 1k Steps (Lower Better)</text>
  <rect x="510" y="356" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="356" width="72" height="10" rx="3" fill="#3fb950"/>
  <text x="738" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">7.5 (1 / 134)</text>
  <rect x="510" y="370" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="370" width="220" height="10" rx="3" fill="#f85149"/>
  <text x="738" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">17.2 - 22.7 (1 / 44-58)</text>

  <!-- Group 4: Avg Execution Context (Lower Better) -->
  <text x="510" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Avg Execution Context (Lower Better)</text>
  <rect x="510" y="409" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="409" width="105" height="10" rx="3" fill="#3fb950"/>
  <text x="738" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#56d364">127K (0% &gt;200K in v2)</text>
  <rect x="510" y="423" width="220" height="10" rx="3" fill="#21262d"/>
  <rect x="510" y="423" width="220" height="10" rx="3" fill="#f85149"/>
  <text x="738" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#ff7b72">264K (65% &gt;200K)</text>

  <!-- Footnote -->
  <text x="28" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Source: Antigravity usage-monitor telemetry (Gemini 4 Neon/Hydrogen list pricing); aggregate hit &amp; spend include real &gt;300s implicit TTL cold reloads.</text>
</svg>
