<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385" role="img" aria-label="Same-Task Spend Breakdown: Single-Model vs Official vs Dual-Brain">
  <!-- Outer Dark-Slate Container -->
  <rect x="1" y="1" width="958" height="383" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc">Same-Task Spend Breakdown: Single-Model vs Official vs Dual-Brain</text>
  <text x="28" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Normalized per 1,000 engineering steps (~1.48M output) showing exact Left-Brain (Trunk) + Right-Brain (Flash) split</text>

  <!-- Legend Row -->
  <rect x="28" y="73" width="11" height="11" rx="2.5" fill="#a371f7"/>
  <text x="44" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Plain Single-Model (Neon Only)</text>

  <rect x="236" y="73" width="11" height="11" rx="2.5" fill="#f85149"/>
  <text x="252" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Official Native (Hot-Swap)</text>

  <rect x="426" y="73" width="11" height="11" rx="2.5" fill="#58a6ff"/>
  <text x="442" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Dual-Brain Left (Trunk Neon)</text>

  <rect x="626" y="73" width="11" height="11" rx="2.5" fill="#3fb950"/>
  <text x="642" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Dual-Brain Right (Stateless Flash)</text>

  <!-- Left Panel: 1x Standard List Pricing -->
  <rect x="24" y="98" width="444" height="206" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="40" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">1x Standard List Pricing (Lower is Better)</text>

  <!-- Left Row 1: Plain Single-Model -->
  <text x="40" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Plain Single-Model (Neon Only)</text>
  <rect x="40" y="154" width="240" height="18" rx="4" fill="#21262d"/>
  <rect x="40" y="154" width="240" height="18" rx="4" fill="#a371f7"/>
  <text x="288" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#d2a8ff">$98.1 (100%)</text>

  <!-- Left Row 2: Official Native -->
  <text x="40" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Official Native Orchestrator</text>
  <rect x="40" y="201" width="240" height="18" rx="4" fill="#21262d"/>
  <rect x="40" y="201" width="223" height="18" rx="4" fill="#f85149"/>
  <text x="271" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ff7b72">$91.0 (-7%)</text>

  <!-- Left Row 3: Dual-Brain Stacked -->
  <text x="40" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Dual-Brain Orchestrator (Left + Right)</text>
  <rect x="40" y="248" width="240" height="18" rx="4" fill="#21262d"/>
  <rect x="40" y="248" width="90" height="18" rx="4" fill="#58a6ff"/>
  <rect x="126" y="248" width="4" height="18" fill="#58a6ff"/>
  <rect x="130" y="248" width="48" height="18" rx="4" fill="#3fb950"/>
  <rect x="130" y="248" width="4" height="18" fill="#3fb950"/>
  <text x="186" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#56d364">$56.3 (-43%)</text>
  <text x="40" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Left (Trunk Neon): $36.6  +  Right (Flash): $19.7</text>

  <!-- Right Panel: High-Context >200K Tier (2x) -->
  <rect x="492" y="98" width="444" height="206" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="508" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">High-Context &gt;200K Tier (2x, Lower is Better)</text>

  <!-- Right Row 1: Plain Single-Model -->
  <text x="508" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Plain Single-Model (Neon Only)</text>
  <rect x="508" y="154" width="240" height="18" rx="4" fill="#21262d"/>
  <rect x="508" y="154" width="240" height="18" rx="4" fill="#a371f7"/>
  <text x="756" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#d2a8ff">$171.8 (100%)</text>

  <!-- Right Row 2: Official Native -->
  <text x="508" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Official Native Orchestrator</text>
  <rect x="508" y="201" width="240" height="18" rx="4" fill="#21262d"/>
  <rect x="508" y="201" width="237" height="18" rx="4" fill="#f85149"/>
  <text x="753" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ff7b72">$169.8 (-1%)</text>

  <!-- Right Row 3: Dual-Brain Stacked -->
  <text x="508" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#c9d1d9">Dual-Brain Orchestrator (Left + Right)</text>
  <rect x="508" y="248" width="240" height="18" rx="4" fill="#21262d"/>
  <rect x="508" y="248" width="92" height="18" rx="4" fill="#58a6ff"/>
  <rect x="596" y="248" width="4" height="18" fill="#58a6ff"/>
  <rect x="600" y="248" width="32" height="18" rx="4" fill="#3fb950"/>
  <rect x="600" y="248" width="4" height="18" fill="#3fb950"/>
  <text x="640" y="261" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#56d364">$88.6 (-48%)</text>
  <text x="508" y="283" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Left (Trunk Neon): $65.6  +  Right (Flash): $23.0</text>

  <!-- Key Takeaway Banner -->
  <rect x="24" y="316" width="912" height="36" rx="8" fill="#12281e" stroke="#238636" stroke-width="1.2"/>
  <text x="40" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#56d364">Key takeaway: Hot-swap cache misses erase Flash savings at 2x ($169.8 vs $171.8); Dual-Brain holds Right Brain at ~127K avg ($19.7 -&gt; $23.0).</text>

  <!-- Footnote -->
  <text x="28" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Plain Single-Model = token replay on Gemini 4 Neon (best-case 95% hit). Official &amp; Dual-Brain = real telemetry (incl. &gt;300s implicit TTL cold reloads).</text>
</svg>
